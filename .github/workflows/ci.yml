name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    # A wedged Ractor or a stream that never ends should fail the run, not hold it for hours
    timeout-minutes: 10
    # The Redis stream is tested against a real Redis
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    strategy:
      fail-fast: false
      matrix:
        # 4.0 runs the Ractor tests, which 3.4 skips - Ractors crash its VM
        ruby: ["3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # For the browser client's tests, which hold it to the Ruby side
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bundle exec rake test
      - name: Style
        run: bundle exec standardrb
      # The types live next to the code; sig/generated is written from them and committed, so it
      # must come out the same here as it was committed
      - name: Types
        run: |
          bundle exec rake rbs
          git diff --exit-code sig/generated || (echo "sig/generated is out of date - run bundle exec rake rbs" && exit 1)
          bundle exec steep check
      - name: Docs
        run: bundle exec rake doc:check
      # The browser client's TypeScript declarations, compiled against by a consumer of them
      - name: Types (JS)
        run: cd test/types && npm install --install-links --no-audit --no-fund && npm run check
